<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>하남 복지 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 지도 카드(좌) + 시설 목록과 상세(우). 초록 상단 띠 아래 한 화면 구성 */
:root{--bg:#f3f1ea;--card:#fff;--fg:#1c2a24;--muted:#5d6b64;--line:#e3e0d5;--green:#1f4a3a;--green-soft:#d9eadf;--pin:#2a6b52;--pin-on:#b5633f;--band:#86a85a;--onGreen:#fff;
--font:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b17;--card:#1d2722;--fg:#e8efe9;--muted:#9fb0a6;--line:#2c3a33;--green:#cfe6d6;--green-soft:#27402f;--pin:#4fa380;--pin-on:#e0875f;--band:#4d6a2f;--onGreen:#13201a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141b17;--card:#1d2722;--fg:#e8efe9;--muted:#9fb0a6;--line:#2c3a33;--green:#cfe6d6;--green-soft:#27402f;--pin:#4fa380;--pin-on:#e0875f;--band:#4d6a2f;--onGreen:#13201a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55}
.band{height:28px;background:var(--band)}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}}
.map-card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.map-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;gap:12px}
.project{margin:0 0 2px;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em}
.map-head h1{margin:0;font-size:22px;font-weight:900;text-wrap:balance}
.chip{font-size:12px;color:var(--green);background:var(--green-soft);border-radius:999px;padding:4px 12px;white-space:nowrap}
.map{position:relative;width:100%;aspect-ratio:1559/1845;background:#ddd;overflow:hidden}
.map img{position:absolute;inset:0;width:100%;height:100%;display:block;max-width:none}
.pin{position:absolute;width:34px;height:42px;transform:translate(-50%,-100%);border:0;background:none;padding:0;cursor:pointer;z-index:2;transition:transform .15s}
.pin svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.pin path{fill:var(--pin)}
.pin span{position:absolute;left:0;right:0;top:6px;text-align:center;color:#fff;font:700 14px/1 var(--font)}
.pin:hover{transform:translate(-50%,-100%) scale(1.1)}
.pin[aria-pressed="true"]{z-index:3;transform:translate(-50%,-100%) scale(1.3)}
.pin[aria-pressed="true"] path{fill:var(--pin-on)}
.pin:focus-visible{outline:3px solid var(--fg);outline-offset:2px;border-radius:8px}
.pin .tip{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);background:var(--green);color:var(--onGreen);font:500 12px/1.3 var(--font);padding:4px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;top:auto}
.pin:hover .tip,.pin[aria-pressed="true"] .tip{opacity:1}
.note{margin:0;padding:12px 22px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.side .eyebrow{font-size:12px;color:var(--muted);margin:0}
.side h2{margin:0 0 14px;font-size:24px;font-weight:900}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.filters button{font:500 13px/1 var(--font);color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--green);color:var(--onGreen);border-color:var(--green)}
.filters button:focus-visible{outline:3px solid var(--pin-on);outline-offset:2px}
.cat{display:inline-block;font-size:12px;font-weight:700;color:var(--onGreen);background:var(--green);border-radius:6px;padding:2px 9px;margin-bottom:8px}
.list{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:8px}
.list button{width:100%;text-align:left;font:500 15px/1.3 var(--font);color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.list button b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.list button[aria-pressed="true"]{background:var(--green);color:var(--onGreen);border-color:var(--green)}
.list button[aria-pressed="true"] b{color:inherit;opacity:.7}
.list button:focus-visible{outline:3px solid var(--pin-on);outline-offset:2px}
.detail{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.detail .count{font-size:12px;color:var(--pin);font-weight:700;font-variant-numeric:tabular-nums}
.detail h3{margin:4px 0 10px;font-size:23px;font-weight:900;text-wrap:balance}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:0;list-style:none}
.tags li{font-size:13px;font-weight:500;color:var(--green);background:var(--green-soft);border-radius:999px;padding:3px 12px}
.detail p.desc{margin:0 0 14px}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:14px}
dt{color:var(--muted);font-weight:700}
dd{margin:0;overflow-wrap:anywhere}
.warn{margin-top:14px;font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:10px 12px}
.bar{height:20px;background:var(--green)}
</style>

const W=1559,H=1845,map=document.getElementById('map'),list=document.getElementById('list'),det=document.getElementById('detail');
const pad=i=>String(i+1).padStart(2,'0');
F.forEach((f,i)=>{
 const p=document.createElement('button');p.className='pin';p.type='button';p.setAttribute('aria-label',f.n);
 p.style.left=(f.x/W*100)+'%';p.style.top=(f.y/H*100)+'%';
 p.innerHTML='<svg viewBox="0 0 34 42"><path d="M17 41C17 41 2 26 2 16a15 15 0 0 1 30 0c0 10-15 25-15 25z"/></svg><span>'+(i+1)+'</span><i class="tip">'+f.n+'</i>';
 p.onclick=()=>sel(i);map.appendChild(p);f.pin=p;
 const li=document.createElement('li'),b=document.createElement('button');b.type='button';
 b.innerHTML='<b>'+pad(i)+'</b><span>'+f.n+'</span>';b.onclick=()=>sel(i);li.appendChild(b);list.appendChild(li);f.btn=b;f.li=li;
});
function sel(i){
 F.forEach((f,j)=>{f.pin.setAttribute('aria-pressed',i===j);f.btn.setAttribute('aria-pressed',i===j)});
 const f=F[i];sel.cur=i;
 det.innerHTML='<span class="cat">'+C[f.c]+'</span><div class="count">시설 '+pad(i)+' / '+pad(F.length-1)+'</div><h3></h3><ul class="tags"></ul><p class="desc"></p><dl></dl>'+(f.warn?'<div class="warn"></div>':'');
 det.querySelector('h3').textContent=f.n;
 det.querySelector('.tags').innerHTML=f.tags.map(t=>'<li>'+t+'</li>').join('');
 det.querySelector('.desc').textContent=f.desc;
 const dl=det.querySelector('dl');f.rows.forEach(r=>{const a=document.createElement('dt'),d=document.createElement('dd');a.textContent=r[0];d.textContent=r[1];dl.append(a,d)});
 if(f.warn)det.querySelector('.warn').textContent=f.warn;
}
const fl=document.getElementById('filters');
['전체',...C].forEach((name,k)=>{const b=document.createElement('button');b.type='button';b.textContent=name;b.setAttribute('aria-pressed',k===0);
 b.onclick=()=>{[...fl.children].forEach(x=>x.setAttribute('aria-pressed',x===b));
  F.forEach(f=>{const on=k===0||f.c===k-1;f.li.hidden=!on;f.pin.hidden=!on});
  const first=F.findIndex(f=>!f.li.hidden);if(first>=0&&F[sel.cur].li.hidden)sel(first)};fl.appendChild(b)});
document.getElementById('total').textContent='미사강변도시 일대 · '+F.length+'곳';
sel(0);
</script>
